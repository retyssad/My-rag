<h1>蓝牙耳机·退换货政策</h1>
<h2>适用范围</h2>
<p>本政策适用于蓝牙耳机类商品。</p>
<h2>七天无理由退货</h2>
<p>自签收之日起 7 天内，商品保持完好、不影响二次销售的，可申请无理由退货。以下情形不适用：已激活且影响二次销售的数码产品、人为损坏、缺少配件。</p>
<h2>质量问题退换</h2>
<p>自签收之日起 15 天内出现非人为性能故障，可凭检测单申请换货或退货。</p>
<h2>退货流程</h2>
<p>1. 在订单页提交退货申请；2. 客服审核；3. 寄回商品；4. 验收后 3~5 个工作日退款。</p>
<h2>运费承担</h2>
<p>质量问题由商家承担运费；无理由退货由消费者承担寄回运费。</p>
</body></html>
