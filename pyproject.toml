[project]
name = "rag-customer-service"
version = "0.1.0"
description = "企业电商客服知识库问答系统（RAG）：混合检索 + 消融评估"
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.2",
    # config / validation
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # db
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pymysql>=1.1",
    "cryptography>=44.0",
    # vector db（pin 到与 Milvus server v2.6.x 匹配的 minor 线）
    "pymilvus>=2.6,<2.7",
    # model clients
    "openai>=1.60",
    "langchain-text-splitters>=0.3",
    # parsing
    "pymupdf>=1.25",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "markdown-it-py>=3.0",
    # misc
    "tenacity>=9.0",
    "jieba>=0.42",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI 依赖注入惯用 `Depends(...)` 作默认值，非缺陷
ignore = ["E501", "B008"]
